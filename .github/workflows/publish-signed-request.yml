name: Publish verified signed APK from release request

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-signed-request.yml'
      - 'release-requests/current.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masbahati-signed-release
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.repository == 'Eslam-Salah/Masbahati-Updates'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate request and extract expected release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,urllib.parse
          from pathlib import Path
          request=json.loads(Path('release-requests/current.json').read_text(encoding='utf-8'))
          version=request.get('version')
          code=request.get('versionCode')
          sha=request.get('sha256')
          url=request.get('signed_archive_url')
          size=request.get('size')
          assert isinstance(version,str) and re.fullmatch(r'\d+\.\d+\.\d+',version)
          assert type(code) is int and code > 0
          assert isinstance(sha,str) and re.fullmatch(r'[a-f0-9]{64}',sha)
          assert type(size) is int and 100000 < size < 100000000
          assert request.get('packageId')=='com.abobakr.tasbeeh'
          assert request.get('signer')=='9182b5af8ff3e6464b959608f33f4b37c5f6e885cd7dae9c88c23821d1288159'
          assert isinstance(url,str)
          parsed=urllib.parse.urlparse(url)
          assert parsed.scheme=='https' and parsed.hostname and parsed.hostname.endswith('.oaiusercontent.com'), 'Signed archive must be scoped file-transfer HTTPS URL'
          notes=request.get('notes')
          assert isinstance(notes,str) and 0<len(notes)<15000
          Path('/tmp/masbahati-release-notes.md').write_text(notes,encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'version={version}\ncode={code}\nsha={sha}\nsize={size}\n')
          print(f'Validated request for v{version} / Build {code}')
          PY
      - name: Fetch private signed APK transfer archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          url=json.loads(Path('release-requests/current.json').read_text(encoding='utf-8'))['signed_archive_url']
          subprocess.run(
              ['curl','--fail','--show-error','--location','--retry','4',
               '--retry-all-errors','--connect-timeout','20','--max-time','150',
               url,'-o','/tmp/masbahati-signed-artifact.zip'],
              check=True
          )
          PY
      - name: Extract original signed APK and check exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          m=json.loads(Path('release-requests/current.json').read_text(encoding='utf-8'))
          name=f"Masbahati-{m['version']}.apk"
          with zipfile.ZipFile('/tmp/masbahati-signed-artifact.zip') as a:
              assert set(a.namelist())=={name,name+'.sha256'}, 'Unexpected files in ZIP'
              raw=a.read(name)
              published_hash=a.read(name+'.sha256').decode('utf-8').split()[0]
          calculated=hashlib.sha256(raw).hexdigest()
          assert len(raw)==m['size'] and calculated==m['sha256'] and calculated==published_hash, 'Signed APK integrity failure'
          Path('dist',name).write_bytes(raw)
          Path('dist',name+'.sha256').write_text(calculated+'  '+name+'\n')
          print(f'APK size and original SHA-256 validated: {calculated}')
          PY
      - uses: android-actions/setup-android@v4
      - name: Install Android package verification tools
        run: sdkmanager --install "build-tools;36.0.0"
      - name: Verify original app signature and version before publication
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ steps.release.outputs.code }}
        run: |
          set -euo pipefail
          apk="dist/Masbahati-$VERSION.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" |
            grep -Fi '9182b5af8ff3e6464b959608f33f4b37c5f6e885cd7dae9c88c23821d1288159'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            grep '^package:' |
            grep -F "name='com.abobakr.tasbeeh'" |
            grep -F "versionCode='$VERSION_CODE'" |
            grep -F "versionName='$VERSION'"
      - name: Publish or independently verify existing GitHub Release
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=Eslam-Salah/Masbahati-Updates
          tag="v$VERSION"
          apk="Masbahati-$VERSION.apk"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo 'Official release already exists: verifying it, never overwriting it.'
          else
            gh release create "$tag" \
              "dist/$apk" "dist/$apk.sha256" \
              --repo "$repo" \
              --title "مسبحتي $VERSION" \
              --notes-file /tmp/masbahati-release-notes.md \
              --latest
          fi
          gh api "repos/$repo/releases/tags/$tag" > /tmp/masbahati-published.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('/tmp/masbahati-published.json').read_text())
          assert not r.get('draft') and not r.get('prerelease')
          name='Masbahati-'+os.environ['VERSION']+'.apk'
          a=[x for x in r.get('assets',[]) if x.get('name')==name]
          assert len(a)==1 and a[0].get('digest')=='sha256:'+os.environ['EXPECTED_SHA'], 'Published APK SHA-256 mismatch'
          assert any(x.get('name')==name+'.sha256' for x in r['assets'])
          print('Success: official release APK digest and checksum independently verified.')
          PY