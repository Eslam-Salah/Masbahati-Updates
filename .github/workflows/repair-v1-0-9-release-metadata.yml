name: Repair v1.0.9 update metadata for in-app updater

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-v1-0-9-release-metadata.yml']

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'Eslam-Salah/Masbahati-Updates'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify official signed asset, repair versionCode field, and re-check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Eslam-Salah/Masbahati-Updates/releases/tags/v1.0.9 > /tmp/release-before.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/release-before.json').read_text())
          assert data['tag_name']=='v1.0.9' and not data['draft'] and not data['prerelease']
          files=[x for x in data['assets'] if x['name']=='Masbahati-1.0.9.apk']
          assert len(files)==1 and files[0]['size']==2443890
          assert files[0]['digest']=='sha256:2f837bb879b7841839871f20e8d6f5c03874b709246f74537cdff5387173d260'
          assert any(x['name']=='Masbahati-1.0.9.apk.sha256' for x in data['assets'])
          original=data.get('body') or ''
          if original.startswith('versionCode: 10\n') or original.strip()=='versionCode: 10':
              target=original
          else:
              assert 'versionCode:' not in original, 'Conflicting build codes in existing description'
              target='versionCode: 10\n\n'+original
          Path('/tmp/masbahati-release-body.json').write_text(json.dumps({'body':target},ensure_ascii=False))
          Path('/tmp/masbahati-release-id').write_text(str(data['id']))
          print('Verified APK and prepared update metadata for Build 10.')
          PY
          release_id="$(cat /tmp/masbahati-release-id)"
          gh api --method PATCH "repos/Eslam-Salah/Masbahati-Updates/releases/$release_id"             --input /tmp/masbahati-release-body.json >/dev/null
          gh api repos/Eslam-Salah/Masbahati-Updates/releases/tags/v1.0.9 > /tmp/release-after.json
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          before=json.loads(Path('/tmp/release-before.json').read_text())
          after=json.loads(Path('/tmp/release-after.json').read_text())
          assert re.search(r'(?m)^versionCode:\s*10\s*$',after['body']), 'In-app versionCode unavailable'
          assert {x['name']:x['digest'] for x in before['assets']} == {x['name']:x['digest'] for x in after['assets']}
          print('SUCCESS: GitHub Release body advertises versionCode 10; signed assets remain unchanged.')
          PY
