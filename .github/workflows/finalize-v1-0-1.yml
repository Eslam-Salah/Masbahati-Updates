name: Finalize published Masbahati v1.0.1 release notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v1-0-1.yml'

permissions:
  contents: write

jobs:
  update-release:
    if: github.repository == 'Eslam-Salah/Masbahati-Updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct final release notes for published build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.0.1 --repo "$GITHUB_REPOSITORY" --notes-file docs/release-notes-v1.0.1.md
          body="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.1" --jq '.body')"
          printf '%s' "$body" | grep -Fq 'versionCode: 2'
          if printf '%s' "$body" | grep -Fq 'مرشح اختبار'; then
            echo "::error::Stale candidate warning remains in public release notes"
            exit 1
          fi
          echo 'Final public release notes verified.'
